services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: cargogo
      POSTGRES_USER: cargogo
      POSTGRES_PASSWORD: cargogo_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargogo -d cargogo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cargogo
      MINIO_ROOT_PASSWORD: change-me-in-local-env
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 cargogo change-me-in-local-env; do sleep 1; done; mc mb --ignore-existing local/cargogo-local; mc anonymous set private local/cargogo-local; exit 0"
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
